# RuboCop configuration for best-practice-ruby.
# Targets Ruby 4.0 and RuboCop 1.88.x with Rails, Performance, and RSpec plugins.
# Formatting Layout cops stay enabled — RuboCop is both formatter (`rubocop -A`)
# and linter for Ruby, unlike the Java/Kotlin split across two tools.
#
# Pin: rubocop 1.88.2, rubocop-rails 2.36.0, rubocop-performance 1.26.1,
# rubocop-rspec 3.10.2 (verified under asdf ruby 4.0.5).

plugins:
  - rubocop-rails
  - rubocop-performance
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'db/schema.rb'
    - 'db/migrate/**/*'
    - 'bin/**/*'
    - 'node_modules/**/*'
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'log/**/*'
    - 'storage/**/*'
    - 'coverage/**/*'
    - '.git/**/*'

# ---------------------------------------------------------------------------
# Style — house defaults that match rubystyle.guide
# ---------------------------------------------------------------------------

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: single_quotes

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always
  SafeAutoCorrect: true

Style/Documentation:
  Enabled: false

Style/ClassAndModuleChildren:
  EnforcedStyle: compact
  Exclude:
    - 'app/controllers/**/*'
    - 'app/helpers/**/*'
    - 'app/mailers/**/*'
    - 'app/jobs/**/*'
    - 'config/**/*'
    - 'spec/**/*'
    - 'test/**/*'
    - 'db/**/*'

Style/HashSyntax:
  EnforcedStyle: ruby19_no_mixed_keys

Style/MethodDefParentheses:
  EnforcedStyle: require_parentheses

Style/SymbolArray:
  EnforcedStyle: percent

Style/WordArray:
  EnforcedStyle: percent

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: consistent_comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: consistent_comma

Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: consistent_comma

Style/Lambda:
  EnforcedStyle: literal

Style/BlockDelimiters:
  EnforcedStyle: line_count_based

Style/NumericLiterals:
  MinDigits: 5

Style/RedundantFreeze:
  Enabled: true

Style/MutableConstant:
  Enabled: true

Style/FetchEnvVar:
  Enabled: true

Style/ArgumentsForwarding:
  Enabled: true

Style/HashTransformKeys:
  Enabled: true

Style/HashTransformValues:
  Enabled: true

Style/MapToHash:
  Enabled: true

Style/MapCompactWithConditionalBlock:
  Enabled: true

Style/DataInheritance:
  Enabled: true

Style/DisableCopsWithinSourceCodeDirective:
  Enabled: true

# ---------------------------------------------------------------------------
# Layout — 2-space indent, 100-column soft limit (rubystyle default is 100)
# ---------------------------------------------------------------------------

Layout/LineLength:
  Max: 100
  AllowedPatterns:
    - '\s+# .*'
    - '^\s*#'

Layout/IndentationWidth:
  Width: 2

Layout/ArgumentAlignment:
  EnforcedStyle: with_fixed_indentation

Layout/HashAlignment:
  EnforcedHashRocketStyle: key
  EnforcedColonStyle: key

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented_relative_to_receiver

Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent

Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent

Layout/ParameterAlignment:
  EnforcedStyle: with_fixed_indentation

# ---------------------------------------------------------------------------
# Naming
# ---------------------------------------------------------------------------

Naming/MethodName:
  EnforcedStyle: snake_case

Naming/VariableName:
  EnforcedStyle: snake_case

Naming/ConstantName:
  Enabled: true

Naming/FileName:
  Enabled: true

Naming/PredicateMethod:
  Enabled: true

Naming/BlockForwarding:
  EnforcedStyle: anonymous

Naming/MemoizedInstanceVariableName:
  Enabled: true

Naming/RescuedExceptionsVariableName:
  PreferredName: error

# ---------------------------------------------------------------------------
# Lint — keep defaults; surface a few that chapters rely on
# ---------------------------------------------------------------------------

Lint/EmptyEnsure:
  Enabled: true

Lint/EnsureReturn:
  Enabled: true

Lint/RescueException:
  Enabled: true

Lint/SuppressedException:
  Enabled: true

Lint/UselessAssignment:
  Enabled: true

Lint/UnusedMethodArgument:
  Enabled: true

Lint/UnusedBlockArgument:
  Enabled: true

Lint/ShadowingOuterLocalVariable:
  Enabled: true

Lint/DuplicateMethods:
  Enabled: true

Lint/MissingSuper:
  Enabled: true

Lint/StructNewOverride:
  Enabled: true

Lint/ConstantDefinitionInBlock:
  Enabled: true

Lint/BinaryOperatorWithIdenticalOperands:
  Enabled: true

Lint/FloatComparison:
  Enabled: true

Lint/NumberConversion:
  Enabled: true

# ---------------------------------------------------------------------------
# Metrics — soft ceilings; chapters treat these as Suggestions when tuned
# ---------------------------------------------------------------------------

Metrics/AbcSize:
  Max: 20

Metrics/MethodLength:
  Max: 20
  CountAsOne: ['array', 'hash', 'heredoc']

Metrics/ClassLength:
  Max: 150
  CountAsOne: ['array', 'hash', 'heredoc']

Metrics/ModuleLength:
  Max: 150
  CountAsOne: ['array', 'hash', 'heredoc']

Metrics/BlockLength:
  Max: 30
  CountAsOne: ['array', 'hash', 'heredoc']
  Exclude:
    - 'spec/**/*'
    - 'test/**/*'
    - 'config/**/*'
    - '*.gemspec'
    - 'Rakefile'
    - '**/*.rake'

Metrics/ParameterLists:
  Max: 5
  CountKeywordArgs: false

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/PerceivedComplexity:
  Max: 10

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------

Security/Eval:
  Enabled: true

Security/JSONLoad:
  Enabled: true

Security/MarshalLoad:
  Enabled: true

Security/Open:
  Enabled: true

Security/YAMLLoad:
